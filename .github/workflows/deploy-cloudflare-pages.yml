name: Verify And Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A newer push to the same branch makes an in-flight run obsolete. Production
# deploys are allowed to finish so a merge is never left half-shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build site
        run: npm run build

      # Everything below publishes to the live site, so it is skipped for pull
      # requests: a PR gets the same lint and build gate without touching
      # production. Only pushes to main (and manual dispatch) deploy.
      #
      # wrangler receives --commit-message as a shell argument, so a multi-line
      # commit body used to split into bare arguments and fail the whole deploy
      # with "Unknown arguments: ...". Collapse to the subject line here.
      # Passing the raw message through an env var (rather than interpolating
      # ${{ }} straight into a command) also keeps commit text out of the
      # command line, where it would otherwise be a script-injection vector.
      - name: Prepare deploy metadata
        id: meta
        if: github.event_name != 'pull_request'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s' "${HEAD_COMMIT_MESSAGE:-}" | head -n 1 | tr -d '"' | cut -c1-72)"
          # workflow_dispatch has no head_commit, so fall back to the short sha.
          if [ -z "$subject" ]; then
            subject="Manual deploy ${GITHUB_SHA:0:7}"
          fi
          echo "commit_message=$subject" >> "$GITHUB_OUTPUT"
          echo "Deploy commit message: $subject"

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name laptime
            --branch main
            --commit-hash ${{ github.sha }}
            --commit-message "${{ steps.meta.outputs.commit_message }}"
